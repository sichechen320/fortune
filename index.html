<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶茶運勢屋</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f1e3d0;--card:#fbf3e8;--ink:#5b4030;--sub:#8a6247;--line:#dcc3a5;--acc:#b9824f;--soft:#efdcc4;--btn:#8a5a3b;--btnink:#fff8ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b211a;--card:#3a2d23;--ink:#f3e4d0;--sub:#d2b392;--line:#574636;--acc:#d9a46c;--soft:#46372b;--btn:#d9a46c;--btnink:#2b211a}}
:root[data-theme="dark"]{--bg:#2b211a;--card:#3a2d23;--ink:#f3e4d0;--sub:#d2b392;--line:#574636;--acc:#d9a46c;--soft:#46372b;--btn:#d9a46c;--btnink:#2b211a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.stage{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:26px;margin:6px 0 2px;text-align:center;letter-spacing:4px}
.tag{text-align:center;color:var(--sub);font-size:13px;margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(91,64,48,.12)}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
#bd{display:flex;align-items:center;justify-content:flex-start;text-align:left;line-height:normal}
#bd::-webkit-date-and-time-value{text-align:left;margin:0}
#bd::-webkit-datetime-edit{padding:0;margin:0;text-align:left}
#bd::-webkit-datetime-edit-fields-wrapper{padding:0}
input[type=date],input[type=number]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px}
.chips input{display:none}
.chips span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--soft);cursor:pointer;color:var(--sub)}
.chips input:checked+span{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.chips label{flex:1;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 14px;background:var(--btn);color:var(--btnink);letter-spacing:1px}
button.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
#go{width:100%;margin-top:18px;font-size:16px;padding:14px}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:5px}
.err{color:#b4482f;font-size:13px;min-height:18px;margin-top:8px}
#result{display:none;margin-top:22px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.actions button{padding:12px 4px;font-size:14px}
.hint{text-align:center;color:var(--sub);font-size:12px;margin-top:10px;min-height:18px}
/* report */
#report{width:100%;aspect-ratio:148/210;background:#fbf3e8;color:#5b4030;border:1px solid #dcc3a5;border-radius:6px;padding:22px 22px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(91,64,48,.18);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#report h2{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;margin:0;font-size:20px;text-align:center;letter-spacing:5px;color:#5b4030}
.sec{border-top:1px dashed #c9a27e;padding-top:10px}
.st{font-size:11px;letter-spacing:3px;color:#8a6247;margin-bottom:6px}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.info div{background:#efdcc4;border-radius:8px;padding:6px 8px;font-size:11px;color:#8a6247}
.info b{display:block;font-size:14px;color:#5b4030;font-weight:600}
.mid{display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:14px}
.stamp{flex:none;width:84px;height:84px;border:3px double #a8532f;color:#a8532f;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Noto Serif TC","Songti TC",serif;font-size:28px;font-weight:700;transform:rotate(-8deg)}
.stamp small{font-size:11px;font-weight:400;letter-spacing:1px}
.blurb{font-size:13px;margin:0}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.bar{font-size:11px;display:flex;align-items:center;gap:6px}
.bar i{flex:1;height:6px;background:#e6d2b8;border-radius:4px;overflow:hidden;display:block}
.bar em{display:block;height:100%;background:#b9824f}
.lucky{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
.lucky span{background:#efdcc4;border-radius:10px;padding:2px 9px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.col{border:1px solid #dcc3a5;border-radius:10px;padding:8px 10px;background:#fffaf2}
.col h3{margin:0 0 4px;font-size:13px;font-family:"Noto Serif TC","Songti TC",serif;letter-spacing:2px}
.col ul{margin:0;padding-left:16px;font-size:12px}
.col li{margin-bottom:4px}
.foot{text-align:center;font-size:10px;color:#a58565;margin-top:auto}
@media print{
@page{size:A5;margin:0}
html,body{background:#fff!important;padding:0!important;margin:0!important}
.noprint{display:none!important}
.stage{padding:0;max-width:none}
#result{display:block!important;margin:0}
#report{width:148mm;height:210mm;border:0;border-radius:0;box-shadow:none;background:#fff;filter:grayscale(1) contrast(1.25);padding:12mm 11mm 8mm;gap:4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#report h2{font-size:24px}.info div,.lucky span{font-size:12px}.blurb{font-size:15px}.col ul{font-size:14px}.stamp{width:26mm;height:26mm}
}
</style>
</head>
<body>
<main class="stage">
  <div class="noprint">
    <h1>奶茶運勢屋</h1>
    <p class="tag">泡杯奶茶，來看看今天的運勢吧 <svg class="ic" viewBox="0 0 24 24"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M9 3v2M13 3v2"/></svg></p>
    <div class="panel">
      <label>性別</label>
      <div class="chips">
        <label><input type="radio" name="g" value="女" checked><span>女</span></label>
        <label><input type="radio" name="g" value="男"><span>男</span></label>
        <label><input type="radio" name="g" value="其他"><span>其他</span></label>
      </div>
      <label for="bd">生日</label>
      <input type="date" id="bd">
      <label for="age">年齡</label>
      <input type="number" id="age" min="1" max="120" inputmode="numeric" placeholder="選擇生日後自動帶入">
      <div class="err" id="err"></div>
      <button id="go"><svg class="ic" viewBox="0 0 24 24"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M9 3v2M13 3v2"/></svg>生成我的運勢報告</button>
    </div>
  </div>

  <section id="result">
    <div id="report">
      <h2>今日運勢小報告</h2>
      <div class="sec">
        <div class="st">基本資料</div>
        <div class="info" id="info"></div>
      </div>
      <div class="sec mid">
        <div class="st">整體運勢</div>
        <div class="top">
          <div class="stamp" id="stamp"></div>
          <p class="blurb" id="blurb"></p>
        </div>
        <div class="bars" id="bars"></div>
        <div class="lucky" id="lucky"></div>
      </div>
      <div class="sec cols">
        <div class="col"><h3>◎ 要注意</h3><ul id="care"></ul></div>
        <div class="col"><h3>✕ 要避免</h3><ul id="avoid"></ul></div>
      </div>
      <div class="foot">本報告僅供娛樂，請以愉快的心情參考</div>
    </div>
    <div class="actions noprint">
      <button id="print"><svg class="ic" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></svg>列印 A5</button>
      <button id="save" class="ghost"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>儲存圖片</button>
      <button id="share" class="ghost"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M8.3 10.8l6.4-3.6M8.3 13.2l6.4 3.6"/></svg>分享</button>
    </div>
    <button id="again" class="ghost noprint" style="width:100%;margin-top:8px"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>再卜一次</button>
    <div class="hint noprint" id="hint"></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const ZOD=["鼠","牛","虎","兔","龍","蛇","馬","羊","猴","雞","狗","豬"];
const SIGNS=[[1,20,"水瓶座"],[2,19,"雙魚座"],[3,21,"牡羊座"],[4,20,"金牛座"],[5,21,"雙子座"],[6,22,"巨蟹座"],[7,23,"獅子座"],[8,23,"處女座"],[9,23,"天秤座"],[10,24,"天蠍座"],[11,23,"射手座"],[12,22,"摩羯座"]];
const CARE=["注意今天看到的第一朵花，那是好兆頭","注意口袋裡突然出現的零錢或小紙條","注意今天第一個對你微笑的人","注意午後三點的光線，適合靜下心想事情","注意路上遇到的第一隻貓或狗","注意今天聽到的第一首歌，藏著小提示","注意傍晚天空的顏色，心情會跟著變柔","注意撞見的重複數字，如 11:11","注意電梯裡遇到的陌生人，可能是貴人","注意桌上最亂的那一角，整理它好運自來","注意今天第一口奶茶的甜度，它會告訴你心情","注意身邊人的口頭禪，藏有靈感"];
const AVOID=["避免吃太甜的甜食，小心甜過頭","避免踩到路上的水窪，好運會濺走","避免晚上十一點後回覆工作訊息","避免坐在背對門口的位置","避免一口氣答應三件事","避免把鑰匙放在包包最底層","避免買第二杯一模一樣的飲料","避免對著鏡子嘆氣超過三秒","避免吃太辣的食物，火氣上來易口角","避免邊走路邊滑手機，會撞掉好運","避免穿全新的鞋子走遠路","避免說「隨便」，今天要好好表態"];
const TEXT={
大吉:["今天彷彿喝到剛好甜度的奶茶，做什麼都順口順心，大膽行動吧！","貴人運旺盛，主動出擊容易得到好回應，好事正在路上。"],
中吉:["整體平穩向上，穩紮穩打就有小確幸，適合推進手邊的計畫。","人緣不錯，與人合作會比單打獨鬥更順利。"],
小吉:["小小幸運藏在日常細節裡，放慢腳步就能發現。","運勢溫和，保持好心情，平凡的一天也能過得很甜。"],
平:["不好不壞的一天，像一杯微糖奶茶，靜靜享受當下就好。","宜守不宜攻，把心力放在整理與休息上會更舒服。"],
小凶:["今天容易有小插曲，別慌，慢慢處理就會過去，記得對自己溫柔。","運勢稍有起伏，凡事多留一點彈性，早點休息養足精神。"]};
const COLORS=["奶茶棕","焦糖色","杏仁白","蜜桃粉","抹茶綠","暖陽黃","可可色"];
const DIRS=["東","南","西","北","東南","西南","東北","西北"];
const DRINKS=["伯爵奶茶","黑糖珍珠鮮奶","烏龍拿鐵","熱可可","桂花烏龍","焙茶拿鐵","港式絲襪奶茶"];

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(r,arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function calcAge(v){const b=new Date(v),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}
function sign(m,d){let s="摩羯座";for(const[mm,dd,name]of SIGNS){if(m>mm||(m===mm&&d>=dd))s=name}return m===12&&d>=22?"摩羯座":(m===1&&d<20?"摩羯座":s)}

$("#bd").addEventListener("change",e=>{if(e.target.value){const a=calcAge(e.target.value);if(a>=0)$("#age").value=a}});

$("#go").onclick=()=>{
  const g=document.querySelector("input[name=g]:checked").value,bd=$("#bd").value,age=$("#age").value;
  if(!bd){$("#err").textContent="請先選擇生日";return}
  if(!age||age<1||age>120){$("#err").textContent="請填寫正確的年齡";return}
  $("#err").textContent="";
  const d=new Date(bd),today=new Date(),ts=today.toISOString().slice(0,10);
  const r=rng(hash([g,bd,age,ts].join("|")));
  const sc={愛情:35+Math.floor(r()*65),事業:35+Math.floor(r()*65),財運:35+Math.floor(r()*65),健康:35+Math.floor(r()*65)};
  const all=Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/4);
  const lv=all>=82?"大吉":all>=72?"中吉":all>=62?"小吉":all>=52?"平":"小凶";
  const zod=ZOD[((d.getFullYear()-4)%12+12)%12],sg=sign(d.getMonth()+1,d.getDate());
  $("#info").innerHTML=[["性別",g],["年齡",age+" 歲"],["生日",bd.replace(/-/g,"/")],["星座",sg],["生肖",zod],["占卜日",ts.replace(/-/g,"/")]].map(([k,v])=>`<div>${k}<b>${v}</b></div>`).join("");
  $("#stamp").innerHTML=`${lv}<small>${all} 分</small>`;
  $("#blurb").textContent=pick(r,TEXT[lv],1)[0];
  $("#bars").innerHTML=Object.entries(sc).map(([k,v])=>`<div class="bar">${k}<i><em style="width:${v}%"></em></i>${v}</div>`).join("");
  $("#lucky").innerHTML=[`幸運色 ${pick(r,COLORS,1)[0]}`,`幸運數字 ${1+Math.floor(r()*99)}`,`吉方 ${pick(r,DIRS,1)[0]}`,`幸運飲品 ${pick(r,DRINKS,1)[0]}`].map(t=>`<span>${t}</span>`).join("");
  $("#care").innerHTML=pick(r,CARE,3).map(t=>`<li>${t}</li>`).join("");
  $("#avoid").innerHTML=pick(r,AVOID,3).map(t=>`<li>${t}</li>`).join("");
  $("#result").style.display="block";
  $("#hint").textContent="同樣的資料在同一天會得到相同結果，明天再來看看新運勢！";
  $("#result").scrollIntoView({behavior:"smooth",block:"start"});
};

function toast(t){$("#hint").textContent=t}
async function makeBlob(){
  const c=await html2canvas($("#report"),{scale:2,backgroundColor:"#fbf3e8",useCORS:true});
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function saveBlob(blob){
  let dl=null;try{dl=await window.claude?.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:"運勢報告.png",data:blob});toast("圖片已儲存 ✓");return}catch(e){if(e&&e.code==="declined"){toast("已取消儲存");return}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="運勢報告.png";document.body.appendChild(a);a.click();a.remove();toast("圖片已儲存 ✓");
}
$("#save").onclick=async()=>{toast("圖片製作中…");try{await saveBlob(await makeBlob())}catch(e){toast("儲存失敗，請稍後再試")}};
$("#share").onclick=async()=>{
  toast("圖片製作中…");
  try{
    const blob=await makeBlob(),file=new File([blob],"運勢報告.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"我的今日運勢",text:"來看看我今天的運勢"});toast("");}
    else{await saveBlob(blob);toast("此環境無法直接分享，已改為儲存圖片，可再上傳到社群 ✓")}
  }catch(e){if(e&&e.name==="AbortError")toast("");else toast("分享失敗，請改用「儲存圖片」")}
};
$("#again").onclick=()=>{$("#bd").value="";$("#age").value="";document.querySelector("input[name=g]").checked=true;$("#err").textContent="";$("#hint").textContent="";$("#result").style.display="none";window.scrollTo({top:0,behavior:"smooth"})};
function pdfFromJpeg(jpg,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;push(n+" 0 obj\n");body.forEach(push);push("\nendobj\n")};
  const PW=419.53,PH=595.28,mg=14,s=(PW-2*mg)/w,dw=w*s,dh=h*s,ox=mg,oy=PH-mg-dh;
  const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${ox.toFixed(2)} ${oy.toFixed(2)} cm /Im0 Do Q`;
  push("%PDF-1.4\n");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids [3 0 R] /Count 1 >>"]);
  obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,"\nendstream"]);
  obj(5,[`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
  const xr=len;let t="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
$("#print").onclick=async()=>{
  toast("正在製作 A5 黑白列印檔…");
  try{
    const c=await html2canvas($("#report"),{scale:3,backgroundColor:"#fbf3e8",useCORS:true,windowWidth:760,onclone:doc=>{
      const r=doc.querySelector("#report"),st=doc.createElement("style");
      st.textContent="#report{width:700px!important;max-width:none!important;aspect-ratio:148/105!important;padding:18px 24px 12px!important;gap:8px!important;box-shadow:none!important;border:0!important;border-radius:0!important}"+
      "#report .info{grid-template-columns:repeat(6,1fr)}#report .info div{padding:5px 6px}"+
      "#report .mid{display:grid!important;grid-template-columns:1fr 1fr;gap:6px 20px}"+
      "#report .mid .st{grid-column:1/-1}#report .mid .top{grid-column:1;grid-row:2/4}#report .mid .bars{grid-column:2;grid-row:2}#report .mid .lucky{grid-column:2;grid-row:3}";
      doc.head.appendChild(st);doc.body.innerHTML="";doc.body.style.cssText="margin:0;padding:0;background:#fbf3e8";doc.body.appendChild(r);
    }});
    const ctx=c.getContext("2d"),im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
    for(let i=0;i<d.length;i+=4){
      const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      const v=Math.max(0,Math.min(255,(g-40)*255/200));
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);
    const jb=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
    const pdf=pdfFromJpeg(new Uint8Array(await jb.arrayBuffer()),c.width,c.height);
    let dl=null;try{dl=await window.claude?.use("downloads")}catch(e){}
    if(dl){await dl.save({filename:"運勢報告_A5黑白.pdf",data:pdf})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download="運勢報告_A5黑白.pdf";document.body.appendChild(a);a.click();a.remove()}
    toast("已儲存 A5 黑白 PDF（報告橫放在上半頁），開啟後選 A5 紙張、實際大小即可列印 ✓");
  }catch(e){toast(e&&e.code==="declined"?"已取消":"製作失敗，請改用「儲存圖片」再列印")}
};
</script>
